<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Taiwan Family Trip</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
:root{color-scheme:light}
@media (prefers-color-scheme: dark){:root{color-scheme:dark}}

/* Layout: phone-first app, 5 bottom tabs, one column up to 720px.
   Colour: cool paper ground, deep teal ink; Kaohsiung amber, Taipei blue, travel violet. */
:root{
  --bg:#F1F5F4; --surface:#FFFFFF; --ink:#15302E; --muted:#58706D; --line:#D6E2DF;
  --accent:#0E7C7B; --accent-ink:#FFFFFF;
  --khh:#9A5B00; --khh-bg:#FBEBD2; --tpe:#245A9E; --tpe-bg:#DCE8F8; --trv:#5B3FA3; --trv-bg:#E8E0F6;
  --good:#2E7D4F; --good-bg:#DDF0E4; --warn:#8A5200; --warn-bg:#FFEBC2; --bad:#B3261E; --bad-bg:#FBDDD9;
  --display:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif; --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1B1A; --surface:#162624; --ink:#E4EFED; --muted:#93AAA6; --line:#2A403D;
  --accent:#4FC1BE; --accent-ink:#06211F;
  --khh:#F0B35B; --khh-bg:#3A2A10; --tpe:#8DB4F0; --tpe-bg:#162A47; --trv:#B9A2F0; --trv-bg:#2A2047;
  --good:#6FCB93; --good-bg:#12301F; --warn:#F2C262; --warn-bg:#3A2D0B; --bad:#F2928B; --bad-bg:#3E1714; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1B1A; --surface:#162624; --ink:#E4EFED; --muted:#93AAA6; --line:#2A403D;
  --accent:#4FC1BE; --accent-ink:#06211F;
  --khh:#F0B35B; --khh-bg:#3A2A10; --tpe:#8DB4F0; --tpe-bg:#162A47; --trv:#B9A2F0; --trv-bg:#2A2047;
  --good:#6FCB93; --good-bg:#12301F; --warn:#F2C262; --warn-bg:#3A2D0B; --bad:#F2928B; --bad-bg:#3E1714; color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);
  padding-top:calc(14px + env(safe-area-inset-top,0px));padding-bottom:100px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.15;text-wrap:balance}
h1{font-size:28px;font-weight:700}
h2{font-size:19px;font-weight:700}
h3{font-size:17px;font-weight:700}
p{margin:0}
.eyebrow{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.small{font-size:13px}
.num{font-variant-numeric:tabular-nums}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
header.top{display:flex;flex-direction:column;gap:6px}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.sync.live i{background:var(--good)}
.sync.off i{background:var(--bad)}
.banner{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.section{display:flex;flex-direction:column;gap:10px;min-width:0}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
/* countdown */
.count{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.count b{font-family:var(--display);font-size:56px;line-height:1;font-weight:700;color:var(--accent)}
.route{display:flex;height:34px;border-radius:9px;overflow:hidden;font-size:12px;font-weight:600}
.route div{display:flex;align-items:center;justify-content:center;padding:0 6px;white-space:nowrap;overflow:hidden}
.route .khh{flex:4;background:var(--khh-bg);color:var(--khh)}
.route .tpe{flex:5;background:var(--tpe-bg);color:var(--tpe)}
.route .fly{flex:1.3;background:var(--trv-bg);color:var(--trv)}
.bar{height:10px;border-radius:6px;background:var(--line);overflow:hidden}
.bar span{display:block;height:100%;background:var(--accent);border-radius:6px}
.chip{display:inline-flex;align-items:center;font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--line);color:var(--muted)}
.chip.bad{background:var(--bad-bg);color:var(--bad)}
.chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.good{background:var(--good-bg);color:var(--good)}
.chip.khh{background:var(--khh-bg);color:var(--khh)}
.chip.tpe{background:var(--tpe-bg);color:var(--tpe)}
.chip.trv,.chip.fly{background:var(--trv-bg);color:var(--trv)}
/* buttons and fields */
button,select,input,textarea{font:inherit;color:inherit}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:9px 14px;font-weight:600;cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.seg{display:flex;background:var(--line);border-radius:11px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;padding:8px 6px;border-radius:9px;font-weight:600;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink)}
input[type=text],input[type=number],select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:8px 10px;min-width:0}
textarea{resize:vertical;min-height:64px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:600;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
/* day cards */
.daycard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.daycard header{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.part{display:grid;grid-template-columns:84px 1fr;gap:8px;font-size:14px}
.part b{font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);padding-top:2px}
.dayhead{width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;align-items:center;gap:12px;cursor:pointer}
.dayhead .d{font-family:var(--display);font-weight:700;font-size:22px;min-width:44px;text-align:center;line-height:1}
.dayhead .d small{display:block;font-family:var(--body);font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase}
.dayhead .t{flex:1;min-width:0}
.dayhead .t b{display:block}
.dayhead .t span{font-size:13px;color:var(--muted)}
.kh{border-left:5px solid var(--khh)} .tp{border-left:5px solid var(--tpe)} .tv{border-left:5px solid var(--trv)}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .w{font-size:11px;font-weight:700;text-align:center;color:var(--muted);text-transform:uppercase;padding:2px 0}
.cal button{aspect-ratio:1/1.1;border:1px solid transparent;background:var(--surface);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;padding:0;min-width:0}
.cal button b{font-family:var(--display);font-size:16px}
.cal button small{font-size:9px;font-weight:700;letter-spacing:.04em}
.cal .out{opacity:.35;background:transparent;cursor:default}
.cal .khh{background:var(--khh-bg);color:var(--khh)} .cal .tpe{background:var(--tpe-bg);color:var(--tpe)} .cal .trv{background:var(--trv-bg);color:var(--trv)}
.cal .today{border-color:var(--ink)}
.cal .sel{outline:2px solid var(--accent);outline-offset:1px}
.legend{display:flex;gap:8px;flex-wrap:wrap}
/* todo */
.item{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .tick{background:none;border:0;padding:0;cursor:pointer;flex:none;line-height:0;margin-top:1px}
.item .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.item.done .tx{color:var(--muted);text-decoration:line-through}
.meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted)}
/* tables */
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px;min-width:440px}
th{text-align:left;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;padding:6px 8px 6px 0;border-bottom:1px solid var(--line)}
td{padding:8px 8px 8px 0;border-bottom:1px solid var(--line);vertical-align:top}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
tr.total td{font-weight:700;border-bottom:0}
.opt{display:flex;flex-direction:column;gap:6px;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.opt .v{font-weight:700}
.opt .v.yes{color:var(--good)} .opt .v.no{color:var(--bad)}
/* bottom nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);z-index:5;
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
nav.tabs div{max-width:720px;margin:0 auto;display:flex}
nav.tabs a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted);text-decoration:none;padding:6px 0;border-radius:10px}
nav.tabs a[aria-current="page"]{color:var(--accent)}
nav.tabs svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:10px;font-size:13px;z-index:9;max-width:90%}
@media (prefers-reduced-motion:no-preference){.bar span{transition:width .3s}}
@media (max-width:420px){.part{grid-template-columns:1fr;gap:0}.count b{font-size:48px}}

</style>
</head>
<body>
<div class="wrap" id="app"></div>
<nav class="tabs" aria-label="Sections"><div>

  <a href="#calendar" data-v="calendar"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M8 3v4M16 3v4M4 10h16"/></svg>Calendar</a>
  <a href="#schedule" data-v="schedule"><svg viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/></svg>Days</a>
  <a href="#todo" data-v="todo"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 12.5l3 3 5-6"/></svg>To-do</a>
  <a href="#rides" data-v="rides"><svg viewBox="0 0 24 24"><path d="M5 16V11l2-5h10l2 5v5M3 16h18M7 19v-3M17 19v-3"/><circle cx="8" cy="13" r=".6"/><circle cx="16" cy="13" r=".6"/></svg>Rides</a>
</div></nav>
<div class="toast" id="toast" hidden></div>


<script>
(function(){

];

DAYS[6]={c:"Taipei (Hsinchu day trip)",h:"Hsinchu orange picking",m:"Van to Xinpu, Hsinchu (confirm drive time). Xinbao Tourist Orchard: wide grounds, suits all ages.",a:"Pick oranges and tangerines (charged by weight). Packed lunch at the orchard.",e:"Back in Taipei by about 5pm. Easy dinner near the hotel.",t:"2 vans, full day",s:"Taipei hotel",x:"Weekend crowds are possible, so phone ahead. Bring a packed halal lunch and water."};
DAYS[8]={c:"Taipei",h:"Pokémon Center & Taipei 101",m:"Late breakfast, then MRT to Taipei City Hall (Exit 3). Pokémon Center Taipei (Shin Kong Mitsukoshi Xinyi Place A11, 3F) opens at 11:00; aim to arrive at opening on this weekday.",a:"Lunch in Xinyi, then Taipei 101 (mall and observatory). Rest as needed.",e:"Halal dinner; see the Taipei 101 lights, then MRT back.",t:"MRT (Bannan Line) or taxis",s:"Taipei hotel",x:"Check the Pokémon Center ticket and queue rules on the day. Plan prayers at the hotel before leaving or at the mall."};

const tag={khh:"KHH",tpe:"TPE",trv:"TRAVEL"};

].map(a=>({id:a[0],t:a[1],cat:a[2],before:a[3],note:a[4]}));

const PSTAT=["Not started","In progress","Done"];

/* ---------- state and sharing (Google Sheets backend) ---------- */
/* Paste the web app address from Apps Script between the quotes (see README). */
const API_URL="PASTE_WEB_APP_URL_HERE";
const SETUP_OK=/^https:\/\/script\.google\.com\//.test(API_URL);
const S={pretrip:{},during:{},days:{},bookings:{},settings:{}};
const ME={name:"",pass:""};
try{ME.name=localStorage.getItem("tt_name")||"";ME.pass=localStorage.getItem("tt_pass")||""}catch(e){}
let sync="connecting",unauth=false,view="home",homeDay=null,selDay=null,pFilter="all",tMode="before",open=new Set(),canWrite=false;
const app=document.getElementById("app");
const cfg=()=>Object.assign({},DEF,S.settings.main||{});
const hasCreds=()=>!!(ME.name&&ME.pass);
const canEdit=()=>SETUP_OK&&hasCreds()&&!unauth;
const queues=new Map(),inflight={};
function toast(m){const t=document.getElementById("toast");t.textContent=m;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>{t.hidden=true},3500)}
async function call(payload){
  const r=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(Object.assign({pass:ME.pass},payload))});
  return r.json();
}
async function pull(){
  if(!SETUP_OK||!ME.pass)return;
  try{
    const j=await call({action:"all"});
    if(j.error==="unauthorized"){unauth=true;sync="live";scheduleRender();return}
    unauth=false;
    const next={pretrip:{},during:{},days:{},bookings:{},settings:{}};
    for(const k in (j.data||{})){const p=k.split("/");if(next[p[0]])next[p[0]][p[1]]=j.data[k]}
    for(const path in inflight){if(inflight[path]>0){const p=path.split("/");if(S[p[0]]&&S[p[0]][p[1]]!==undefined)next[p[0]][p[1]]=S[p[0]][p[1]]}}
    for(const c in S)S[c]=next[c];
    sync="live";scheduleRender();
  }catch(e){sync="off";scheduleRender()}
}
function save(coll,id,data){
  S[coll][id]=data;scheduleRender();
  if(!canWrite)return;
  const path=coll+"/"+id;
  inflight[path]=(inflight[path]||0)+1;
  const prev=queues.get(path)||Promise.resolve();
  queues.set(path,prev.then(()=>call({action:"set",key:path,value:data,name:ME.name})).then(j=>{
    if(j&&j.error==="unauthorized"){unauth=true;scheduleRender()}
    else if(j&&j.error)toast("Could not save ("+j.error+").");
  }).catch(()=>toast("Could not save. Check your connection and try again.")).finally(()=>{inflight[path]--}));
}
let raf=0,pending=false;
function scheduleRender(){
  const a=document.activeElement;
  if(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)&&app.contains(a)){pending=true;return}
  cancelAnimationFrame(raf);raf=requestAnimationFrame(render);
}
document.addEventListener("focusout",()=>{if(pending){pending=false;setTimeout(scheduleRender,60)}});
function setupCard(){return '<div class="banner">This copy is not connected yet. Open index.html and paste your Apps Script web app address into API_URL (see README).</div>'}
function gateCard(){return `<form class="card" id="gate"><h2>Join the family plan</h2><p class="small muted">Enter your name and the family passcode. They are saved on this device only.</p><label class="f">Your name<input type="text" id="g-name" value="${esc(ME.name)}" autocomplete="name"></label><label class="f">Family passcode<input type="password" id="g-pass" autocomplete="off"></label><button class="btn" type="submit">Join</button></form>`}
document.addEventListener("submit",e=>{

/* ---------- helpers ---------- */
const tickSvg=s=>s==="Done"?'<svg viewBox="0 0 24 24" width="28" height="28"><circle cx="12" cy="12" r="11" fill="var(--good)"/><path d="M7 12.5l3.2 3.2L17 9" fill="none" stroke="var(--bg)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>'
 :s==="In progress"?'<svg viewBox="0 0 24 24" width="28" height="28"><circle cx="12" cy="12" r="10" fill="none" stroke="var(--warn)" stroke-width="2"/><path d="M12 2a10 10 0 0 1 0 20z" fill="var(--warn)"/></svg>'
 :'<svg viewBox="0 0 24 24" width="28" height="28"><circle cx="12" cy="12" r="10" fill="none" stroke="var(--muted)" stroke-width="2"/></svg>';
const who=r=>r&&r.by?esc(r.by):"";
const dis=()=>canWrite?"":" disabled";
function costs(){
  const c=cfg(),total=c.elderly+c.adults+c.teens+c.kids+c.toddlers,vans=Math.max(1,Math.ceil(total/c.perVan));
  const vrows=VANS.map(v=>({d:addDays(START,v[0]),p:v[1],ty:v[2],rate:v[2]==="Full day"?c.fullDay:c.transfer,cost:vans*(v[2]==="Full day"?c.fullDay:c.transfer)}));
  const van=vrows.reduce((a,b)=>a+b.cost,0);
  const full=c.elderly+c.adults+c.teens,hsr=(full*c.hsrFare+c.kids*c.hsrFare*.5)*2;
  const tot=van+hsr;
  return{c,total,vans,vrows,van,hsr,tot,sgd:tot/c.fx,pp:tot/c.fx/total,full};
}
function pdue(t){return addDays(START,-t.before)}
function pstatus(t){return (S.pretrip[t.id]||{}).status||"Not started"}
function pflag(t){if(pstatus(t)==="Done")return"";const d=dayDiff(pdue(t),today());return d<0?"bad":d<=7?"warn":""}
function dayCard(i,full){
  const d=DAYS[i],dt=addDays(START,i),k=cityKey(d.c),rec=S.days["d"+i]||{},st=rec.status||"Planned";
  const part=(l,v)=>v?`<div class="part"><b>${l}</b><span>${esc(v)}</span></div>`:"";
  let h=`<article class="daycard ${k==="khh"?"kh":k==="tpe"?"tp":"tv"}"><header><div><div class="eyebrow">${fmt(dt,{weekday:"short",day:"numeric",month:"short"})} · ${esc(d.c)}</div><h3>${esc(d.h)}</h3></div><span class="chip ${st==="Done"?"good":st==="Booked"?"tpe":""}">${st}</span></header>`;
  h+=part("Morning",d.m)+part("Afternoon",d.a)+part("Evening",d.e);
  if(full){
    h+=part("Transport",d.t)+part("Stay",d.s)+part("Halal & prayer",d.x);
    h+=`<div class="grid2"><label class="f">Status<select id="st-${i}" data-day="${i}" data-f="status"${dis()}>${STATUSES.map(s=>`<option${s===st?" selected":""}>${s}</option>`).join("")}</select></label></div>`;
    h+=`<label class="f">Family notes for this day<textarea id="note-${i}" data-day="${i}" data-f="note" placeholder="e.g. Aunty prefers a short walk here"${dis()}>${esc(rec.note||"")}</textarea></label>`;
    if(rec.note&&who(rec))h+=`<div class="small muted">Last note by ${who(rec)}</div>`;
  }
  return h+"</article>";
}

   <p class="small muted">Vans and HSR only. Meals, tickets, hotels and flights are not included.</p></section>`;

function vCalendar(){

  const v=(location.hash||"#home").slice(1);
  view=VIEWS[v]?v:"home";
  document.querySelectorAll("nav.tabs a").forEach(a=>{if(a.dataset.v===view)a.setAttribute("aria-current","page");else a.removeAttribute("aria-current")});
  canWrite=canEdit();
  const sy=!hasCreds()||unauth?'<span class="sync"><i></i>Not joined yet</span>':sync==="live"?'<span class="sync live"><i></i>Shared and up to date</span>':sync==="off"?'<span class="sync off"><i></i>Not connected</span>':'<span class="sync"><i></i>Connecting…</span>';
  let top=`<header class="top"><div class="eyebrow">13–22 Dec 2026 · Kaohsiung and Taipei</div><h1>Taiwan Family Trip</h1><div class="row">${sy}${hasCreds()&&!unauth?`<button class="btn ghost" data-a="forget" style="padding:3px 10px;font-size:12px">${esc(ME.name)} · change</button>`:""}</div></header>`;
  if(!SETUP_OK)top+=setupCard();
  else if(!hasCreds()||unauth)top+=(unauth?'<div class="banner">That passcode was not accepted. Try again.</div>':"")+gateCard();
  else if(sync==="off")top+='<div class="banner">Shared data is not reachable right now. Changes you make may not be saved. Reload to try again.</div>';
  app.innerHTML=top+VIEWS[view]();
}
window.addEventListener("hashchange",()=>{window.scrollTo(0,0);render()});

/* ---------- events ---------- */
app.addEventListener("click",e=>{
  const b=e.target.closest("[data-a]");if(!b)return;
  const a=b.dataset.a,i=+b.dataset.i;
  if(a==="forget"){try{localStorage.removeItem("tt_name");localStorage.removeItem("tt_pass")}catch(x){}ME.name="";ME.pass="";unauth=false;render()}
  else if(a==="hprev"){homeDay=Math.max(0,homeDay-1);render()}
  else if(a==="hnext"){homeDay=Math.min(10,homeDay+1);render()}
  else if(a==="pick"){selDay=i;render()}
  else if(a==="openday"){open.add(i);location.hash="#schedule";setTimeout(()=>{const el=document.querySelector('[data-a="toggle"][data-i="'+i+'"]');if(el)el.scrollIntoView({block:"start"})},60)}
  else if(a==="toggle"){open.has(i)?open.delete(i):open.add(i);render()}
  else if(a==="tmode"){tMode=b.dataset.m;render()}
  else if(a==="pfilter"){pFilter=b.dataset.f;render()}
  else if(a==="cycle"&&canWrite){const t=TASKS.find(x=>x.id===b.dataset.id),s=PSTAT[(PSTAT.indexOf(pstatus(t))+1)%3];save("pretrip",t.id,{status:s,by:ME.name||null})}
  else if(a==="dtick"&&canWrite){const id=b.dataset.id,r=S.during[id];save("during",id,{done:!(r&&r.done),by:ME.name||null})}
});
app.addEventListener("change",e=>{
  const el=e.target;
  if(el.dataset.bk){const m=Object.assign({},S.bookings.main||{});m[el.dataset.bk]=el.value.trim();save("bookings","main",m)}
  else if(el.dataset.cfg){const v=parseFloat(el.value);if(isFinite(v)&&v>=0){const m=Object.assign({},S.settings.main||{});m[el.dataset.cfg]=v;save("settings","main",m)}}
  else if(el.dataset.day!=null){const k="d"+el.dataset.day,r=Object.assign({},S.days[k]||{});r[el.dataset.f]=el.value;r.by=ME.name||null;save("days",k,r)}
});
boot();
})();
</script>
